# development setup

services:

  db:
    image: mariadb:12
    restart: always
    volumes: 
      - data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    volumes:
      - .:/rails:cached
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 300s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

volumes:
  data:
