# development setup

services:

  db:
    image: mariadb:12
    restart: always
    volumes: 
      - mariadb_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    volumes:
      - .:/rails:cached
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
